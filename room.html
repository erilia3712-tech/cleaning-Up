<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cleaning Up - Ruangan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="room">
  <div class="app-shell">
    <header class="page-header">
      <div>
        <a href="index.html" class="back">← Kembali</a>
        <h1 id="room-title">Ruangan</h1>
        <p class="subtle">Pilih status kebersihan setiap item di bawah ini.</p>
      </div>
    </header>

    <main class="page-card">
<div id="barcode-container" style="text-align:center;margin-bottom:12px">
  <div id="barcode-qr" class="qr" style="display:none;margin:0 auto;"></div>
</div>

      <div id="room-info" class="room-summary"></div>
      <div class="date-controls">
        <label class="field-group">
          <span>Tanggal</span>
          <input type="date" id="record-date" />
        </label>
        <label class="field-group">
          <span>Bulan</span>
          <input type="month" id="record-month" />
        </label>
      </div>

      <div id="history-summary" class="history-summary"></div>

      <form id="checklist-form" class="checklist-card"></form>

      <div class="actions">
        <button id="save-btn" type="button">💾 Simpan</button>
        <button id="update-btn" type="button" class="secondary-btn">🔄 Update</button>
        <button id="delete-btn" type="button" class="secondary-btn danger-btn">🗑️ Hapus data</button>
        <a id="open-report" class="secondary-btn" href="#">📊 Lihat rekap bulan ini</a>
        <span id="saved-at"></span>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
