<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cleaning Up - Rekap Bulanan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="summary">
  <div class="app-shell">
    <header class="page-header">
      <div>
        <a id="back-to-room" href="index.html" class="back">← Kembali</a>
        <h1 id="room-title">Rekap Bulanan</h1>
        <p class="subtle">Lihat ringkasan data per bulan untuk ruangan ini.</p>
      </div>
    </header>

    <main class="page-card">
      <div id="room-info" class="room-summary"></div>

      <div class="date-controls">
        <label class="field-group">
          <span>Pilih Bulan</span>
          <input type="month" id="summary-month" />
        </label>
        <div class="summary-print-control">
          <span class="field-label">Laporan</span>
          <button id="print-summary" type="button" class="secondary-btn">🖨️ Cetak laporan</button>
        </div>
      </div>

      <section class="summary-card">
        <div class="summary-header">
          <h3>Ringkasan Bulan</h3>
          <div id="month-report-stats" class="summary-stats"></div>
        </div>
        <div id="month-report-chart" class="status-chart" aria-label="Grafik status kebersihan"></div>
      </section>

      <section class="summary-card print-table-card">
        <div class="summary-header">
          <h3>Rekap Harian</h3>
        </div>
        <div class="report-table-wrap">
          <table id="month-report-table" class="report-table"></table>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js?v=20260921"></script>
</body>
</html>
